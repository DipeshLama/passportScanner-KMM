name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android tests and sample build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :passportscanner:testAndroidHostTest :androidApp:assembleDebug

  ios:
    name: iOS tests and API check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      # checkKotlinAbi runs here because the iOS part of the API dump needs a Mac.
      # If it fails after an intended API change, run `./gradlew :passportscanner:updateKotlinAbi`
      # and commit the files in passportscanner/api/.
      - run: ./gradlew :passportscanner:iosSimulatorArm64Test :passportscanner:checkKotlinAbi
